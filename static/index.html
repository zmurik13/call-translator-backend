<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Translator</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>

    <div class="header">
        <select id="langPairSelector" class="pair-selector">
            <option value="ru-lt">🇷🇺 RU ↔ 🇱🇹 LT</option>
            <option value="ru-pl">🇷🇺 RU ↔ 🇵🇱 PL</option>
            <option value="lt-pl">🇱🇹 LT ↔ 🇵🇱 PL</option>
        </select>
        <div id="status">Зажмите кнопку для перевода</div>
    </div>

    <div class="container">
        <!-- Кнопки теперь универсальные, их текст обновляется через JS -->
        <button id="btnTop" class="btn">
            <div id="btnTopLabel">🇷🇺 RU ➔ LT</div>
            <span>Зажать и говорить</span>
        </button>

        <button id="btnBottom" class="btn">
            <div id="btnBottomLabel">🇱🇹 LT ➔ RU</div>
            <span>Зажать и говорить</span>
        </button>
    </div>

    <div class="text-box">
        <strong><span id="dotSource">●</span> Распознано:</strong>
        <div id="recognized">...</div>
    </div>

    <div class="text-box">
        <strong><span id="dotTarget">●</span> Перевод:</strong>
        <div id="translated">...</div>
    </div>

    <script src="/static/app.js?v=3"></script>
</body>
</html>
